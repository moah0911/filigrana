[project]
name = "filigrana"
dynamic = ["version"]
description = "Writer-held statistical watermark: evidence that your prose is yours, never a verdict"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rad" }]
keywords = ["watermarking", "statistical-watermarking", "provenance", "authorship", "text"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]

[project.optional-dependencies]
lm = ["transformers>=4.46", "torch>=2.2"]
# Ed25519 manifests: pip install 'filigrana[sign]'. Refuses to rotate its own curve maths.
sign = ["cryptography>=42"]
# WordNet candidate proposals: needs the corpus downloaded as well (see filigrana.lexical).
lexical = ["nltk>=3.8"]

[project.scripts]
filigrana = "filigrana.cli:main"

[project.urls]
Homepage = "https://github.com/moah0911/filigrana"
Repository = "https://github.com/moah0911/filigrana"
Issues = "https://github.com/moah0911/filigrana/issues"
Changelog = "https://github.com/moah0911/filigrana/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/filigrana/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/filigrana"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/filigrana",
  "/tests",
  "/docs",
  "/examples",
  "/bench",
  "/tools",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/pyproject.toml",
]
exclude = [
  "/**/__pycache__",
  "/**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "ISC"]
ignore = [
  # The word regexes and prose quotes use the real typographic apostrophe on purpose
  # (`’`); folding it to a grave accent would change what canon.py matches.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.11"
files = ["src/filigrana"]
# The optional-dependency boundary is typed honestly loose: torch/transformers/nltk carry
# no usable stubs for what we do, so those call sites say Any deliberately.
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
]
release = [
  "build>=1.2",
  "twine>=5.1",
]
