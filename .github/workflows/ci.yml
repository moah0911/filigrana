name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Intel rather than macos-latest: arm64 macOS runners have repeatedly failed to
        # provision on this repository, while macos-15-intel is a supported label through
        # August 2027 and gives the same Python coverage.
        os: [ubuntu-latest, macos-15-intel]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - os: macos-15-intel
            python-version: "3.11"
          - os: macos-15-intel
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: uv sync --locked --dev
      - name: Lint (ruff)
        run: uv run ruff check src/ tools/ tests/
      - name: Types (mypy)
        run: uv run mypy
      - name: Tests
        run: >
          uv run pytest
          --cov=filigrana --cov-report=term-missing --cov-fail-under=85

  # Optional-dependency tiers get a real job rather than a hope: the Ed25519 manifest and
  # the WordNet provider both carry skip-guards, so plain dev-dep CI never exercises them.
  # `lm` (torch) is left out of default CI on cost; its pure seams are unit-tested without
  # torch, and tools/measure_lm_gate.py documents the full model-gated run.
  optional-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install with sign + lexical extras
        run: uv sync --locked --dev --extra sign --extra lexical
      - name: Tests (Ed25519 and WordNet tiers included)
        run: uv run pytest

  benchmarks:
    # Reproducibility of the quoted numbers, at CI-affordable article counts; the exact
    # 60-article sweep that produced bench/*.json still belongs to a workstation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dev tooling
        run: uv sync --locked --dev
      - name: Density and null calibration
        run: uv run python tools/measure_free_choices.py --corpus corpus --lengths 1075 --keys 6
      - name: Attack sweep
        run: uv run python tools/attack_eval.py --corpus corpus --articles 20 --words 2500

  release:
    # PyPI is published by hand from a release workstation; this job only attaches the same
    # sdist and wheel to the GitHub release once the tag is pushed and the tests are green.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, optional-extras]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install release tooling
        run: uv sync --locked --group release
      - name: Build sdist and wheel
        run: uv run python -m build
      - name: Check distribution metadata
        run: uv run twine check dist/*
      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
